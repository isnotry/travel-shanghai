<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Welcome to Shanghai · A Practical Travel Guide</title>
<meta name="description" content="A practical Shanghai travel guide: 58 handpicked sights with admission prices, how long to allow, how to get there, and closed-day warnings - plus visa, payment and connectivity essentials.">
<link rel="stylesheet" href="../assets/css/common.css">
<link rel="stylesheet" href="../assets/css/theme-en.css">
</head>
<body data-lang="en">

<header class="topbar">
  <div class="wrap topbar-in">
    <div class="brand"><span class="dot"></span><span id="brand-text">Welcome to Shanghai</span></div>
    <nav class="navlinks" id="nav"></nav>
    <a class="langbtn" id="swap" href="../zh/" title="Switch to Chinese">中文</a>
  </div>
</header>

<main>
  <section class="hero" id="hero"></section>

  <section id="tips">
    <div class="wrap">
      <div id="alert"></div>
      <div class="sechead">
        <span class="num">01 / Before You Go</span>
        <h2 id="sec-tips-title"></h2>
        <p id="sec-tips-sub"></p>
      </div>
      <div class="notes-grid" id="notes"></div>
      <div id="warnings"></div>
    </div>
  </section>

  <section id="sights">
    <div class="wrap">
      <div class="sechead">
        <span class="num">02 / Highlights</span>
        <h2 id="sec-sights-title"></h2>
        <p id="sec-sights-sub"></p>
      </div>
      <div class="filters" id="filters"></div>
      <div class="fav-strip" id="favstrip"></div>
      <div class="count" id="count"></div>
      <div class="cards" id="cards"></div>
    </div>
  </section>

  <section id="itineraries">
    <div class="wrap">
      <div class="sechead">
        <span class="num">03 / Itineraries</span>
        <h2 id="sec-itin-title"></h2>
        <p id="sec-itin-sub"></p>
      </div>
      <div class="itins" id="itins"></div>
    </div>
  </section>

  <section id="food">
    <div class="wrap">
      <div class="sechead">
        <span class="num">04 / Shanghai on a Plate</span>
        <h2 id="sec-food-title"></h2>
        <p id="sec-food-sub"></p>
      </div>
      <div class="food-grid" id="foodlist"></div>
    </div>
  </section>

  <section id="practical">
    <div class="wrap">
      <div class="sechead">
        <span class="num">05 / Practical A–Z</span>
        <h2 id="sec-ess-title"></h2>
        <p id="sec-ess-sub"></p>
      </div>
      <div class="ess-grid" id="ess"></div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <p class="disclaimer" id="foot-note"></p>
    <p>Shanghai Travel Guide · 1024 Creation Challenge<br />
      <a class="repo-link" href="https://github.com/isnotry/travel-shanghai" target="_blank" rel="noopener noreferrer">Open source on GitHub</a>
    </p>
  </div>
</footer>

<div class="modal" id="modal">
  <div class="modal-bg"></div>
  <div class="modal-box" id="modal-box"></div>
</div>

<button class="totop" id="totop" title="Back to top" aria-label="Back to top">&#8593;</button>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/content.js"></script>
<script src="../assets/js/app.js"></script>
</body>
</html>
